plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}

def escapeForBuildConfig = { String value ->
    (value ?: '').replace('\\', '\\\\').replace('"', '\\"')
}

android {
    namespace 'com.jason.aichat'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jason.aichat'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'

        buildConfigField 'String', 'LLM_API_KEY', "\"${escapeForBuildConfig(localProps.getProperty('llm.api.key', ''))}\""
        buildConfigField 'String', 'LLM_BASE_URL', "\"${escapeForBuildConfig(localProps.getProperty('llm.base.url', 'https://api.openai.com/v1'))}\""
        buildConfigField 'String', 'LLM_MODEL', "\"${escapeForBuildConfig(localProps.getProperty('llm.model', 'gpt-4o-mini'))}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
